map_frame: map
# Robot starts and target IDs/centers/radii/holds come from
# edgeai_robot_description/config/rescue_{robots,targets}.yaml.
targets:
  S1:
    robots: [robot2]
    goals:
      # Approach the stand and hold here until the rescue is verified.
      robot2: [1.4 , 4.1, 3.141592653590]
  C1:
    robots: [robot1, robot2]
    # Robot1 heads to the left slot during S1. Robot2 joins at the right slot.
    goals:
      robot1: [3.8, 1.4, -1.570796326795]
      robot2: [4.5, 1.4, -1.570796326795]
timing:
  combined_budget: 780.0
  elapsed_before_part2: 0.0
  localization_timeout: 90.0
  navigation_timeout: 150.0
  selection_timeout: 15.0
  position_timeout: 6.0
  recovery_timeout: 12.0
  recovery_wait: 2.0
  max_recoveries: 2
localization:
  max_tf_age: 0.5
  max_pose_age: 2.5
  max_scan_age: 0.5
  max_xy_variance: 0.02
  max_yaw_variance: 0.10
  max_observation_gap: 0.5
  ready_samples: 5
# Optional collision-checked Nav2 Spin, performed sequentially after initialization.
initial_scan_angle: 0.0
s1_departure_distance: 0.4
