amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: '{robot}/drive_frame'
    odom_frame_id: '{robot}/odom'
    global_frame_id: map
    scan_topic: scan
    map_topic: /map
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_min_range: 0.15
    laser_max_range: 12.0
    max_beams: 180
    min_particles: 500
    max_particles: 1500
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    sigma_hit: 0.05
    z_hit: 0.85
    z_rand: 0.15
    laser_likelihood_max_dist: 1.0
    update_min_d: 0.04
    update_min_a: 0.04
    resample_interval: 1
    transform_tolerance: 0.3
    tf_broadcast: true
    # The verifier seeds AMCL once through SetInitialPose, including uncertainty.
    set_initial_pose: false
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: '{robot}/drive_frame'
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: odom
    enable_stamped_cmd_vel: false
    controller_frequency: 20.0
    costmap_update_timeout: 1.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.10
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 3.14
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.50
      lookahead_dist: 0.30
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 1.5
      rotate_to_heading_min_angle: 0.5
      use_rotate_to_heading: true
      max_angular_accel: 1.5
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.03
      approach_velocity_scaling_dist: 0.4
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.05
      use_cost_regulated_linear_velocity_scaling: false
      allow_reversing: false
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.05
      use_astar: false
      allow_unknown: true
behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    local_frame: '{robot}/odom'
    global_frame: map
    robot_base_frame: '{robot}/drive_frame'
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, wait]
    spin: {plugin: 'nav2_behaviors::Spin'}
    backup: {plugin: 'nav2_behaviors::BackUp'}
    wait: {plugin: 'nav2_behaviors::Wait'}
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: '{robot}/drive_frame'
    odom_frame_id: '{robot}/odom'
    cmd_vel_in_topic: mux_cmd_vel
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.3
    source_timeout: 0.6
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons: [StopFootprint]
    StopFootprint:
      type: polygon
      action_type: stop
      min_points: 1
      visualize: true
      polygon_pub_topic: safety_polygon
      enabled: true
      # points is filled from the actual URDF collision envelope at launch.
    observation_sources: [scan, peer]
    scan: {type: scan, topic: scan, enabled: true}
    peer: {type: pointcloud, topic: peer_obstacles, min_height: 0.0, max_height: 1.0, enabled: true}
twist_mux:
  ros__parameters:
    use_sim_time: true
    use_stamped: false
    topics:
      navigation: {topic: nav_cmd_vel, timeout: 0.5, priority: 10}
    locks:
      mission: {topic: mission_stop, timeout: 0.5, priority: 255}
      localization: {topic: localization_stop, timeout: 0.5, priority: 255}
