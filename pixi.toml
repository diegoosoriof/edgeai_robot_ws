[workspace]
name = "edgeai_robot_ws"
channels = [
  "https://prefix.dev/conda-forge",
  "https://prefix.dev/robostack-jazzy",
]
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
# ROS 2 Jazzy
ros2-distro-mutex = ">=0.13,<0.14"
ros-jazzy-ros2cli = "*"
ros-jazzy-ros2run = "*"
ros-jazzy-ros2launch = "*"
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-joint-state-publisher = "*"
ros-jazzy-xacro = "*"
ros-jazzy-rviz2 = "*"
ros-jazzy-tf2-ros = "*"
ros-jazzy-ros-gz = ">=1.0.18,<2"
ros-jazzy-tf2-tools = ">=0.36.18,<0.37"
ros-dev-tools = ">=1.0.2,<2"
ros-jazzy-slam-toolbox = ">=2.8.3,<3"
ros-jazzy-ros2node = ">=0.32.7,<0.33"
ros-jazzy-ros2param = ">=0.32.7,<0.33"
ros-jazzy-ros2interface = ">=0.32.7,<0.33"
ros-jazzy-nav2-map-server = ">=1.3.10,<2"
ros-jazzy-ros2lifecycle = ">=0.32.7,<0.33"
ros-jazzy-nav2-amcl = ">=1.3.10,<2"
ros-jazzy-nav2-lifecycle-manager = ">=1.3.10,<2"
ros-jazzy-rqt-graph = ">=1.5.5,<2"
ros-jazzy-navigation2 = ">=1.3.10,<2"
ros-jazzy-nav2-bringup = ">=1.3.10,<2"
scipy = ">=1.18.1,<2"
opencv = ">=4.12.0,<5"

# ArUco perception (OpenCV's conda build includes the ArUco module).
ros-jazzy-rclpy = ">=7.1,<8"
ros-jazzy-rcl-interfaces = "*"
ros-jazzy-sensor-msgs = "*"
ros-jazzy-geometry-msgs = "*"
ros-jazzy-std-msgs = "*"
ros-jazzy-vision-msgs = ">=4.1,<5"
ros-jazzy-visualization-msgs = "*"
ros-jazzy-cv-bridge = ">=4.1,<5"
ros-jazzy-tf2-geometry-msgs = ">=0.36,<0.37"
py-opencv = ">=4.10,<5"
numpy = ">=1.26,<3"
# Jazzy launch_testing still uses pytest's pre-9 hook signatures.
pytest = ">=8,<9"
# colcon's symlink install uses the legacy setuptools develop command.
setuptools = ">=68,<80"
ros-jazzy-teleop-twist-keyboard = ">=2.4.1,<3"

# Part 2: independent localization/navigation and rescue coordination.
ros-jazzy-twist-mux = "*"
ros-jazzy-std-srvs = "*"
ros-jazzy-nav-msgs = "*"
ros-jazzy-nav2-msgs = ">=1.3.10,<2"

[activation.env]
RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp"
ROS_AUTOMATIC_DISCOVERY_RANGE = "SUBNET"
ROS_DOMAIN_ID = "0"
# Keep simulation, RViz and CLI terminals on the same local DDS transport.
CYCLONEDDS_URI = "file://$PIXI_PROJECT_ROOT/src/edgeai_robot_description/config/rescue_simulation_dds.xml"
