[workspace]
name = "edgeai_robot_ws"
channels = [
  "https://prefix.dev/conda-forge",
  "https://prefix.dev/robostack-jazzy",
]
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
tracking-test = { cmd = "python -m pytest -q src/edgeai_robot_tracking/test", env = { PYTHONPATH = "src/edgeai_robot_tracking", PYTEST_DISABLE_PLUGIN_AUTOLOAD = "1" } }
tracking-lint = "flake8 --config=src/edgeai_robot_tracking/setup.cfg src/edgeai_robot_tracking"

[dependencies]
# ROS 2 Jazzy
ros2-distro-mutex = ">=0.13,<0.14"
ros-jazzy-ros2cli = "*"
ros-jazzy-ros2run = "*"
ros-jazzy-ros2launch = "*"
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-joint-state-publisher = "*"
ros-jazzy-xacro = "*"
ros-jazzy-rviz2 = "*"
ros-jazzy-tf2-ros = "*"
ros-jazzy-ros-gz = ">=1.0.18,<2"
ros-jazzy-tf2-tools = ">=0.36.18,<0.37"
ros-dev-tools = ">=1.0.2,<2"
ros-jazzy-slam-toolbox = ">=2.8.3,<3"
ros-jazzy-ros2node = ">=0.32.7,<0.33"
ros-jazzy-ros2param = ">=0.32.7,<0.33"
ros-jazzy-ros2interface = ">=0.32.7,<0.33"
ros-jazzy-nav2-map-server = ">=1.3.10,<2"
ros-jazzy-ros2lifecycle = ">=0.32.7,<0.33"
ros-jazzy-nav2-amcl = ">=1.3.10,<2"
ros-jazzy-nav2-lifecycle-manager = ">=1.3.10,<2"
setuptools = "<80"
ros-jazzy-cv-bridge = ">=4.1.0,<5"
ros-jazzy-message-filters = ">=4.11.9,<5"
ros-jazzy-diagnostic-msgs = ">=5.3.6,<6"
ros-jazzy-visualization-msgs = ">=5.3.6,<6"
py-opencv = ">=4.12.0,<5"
numpy = ">=2.5.4,<3"

[activation.env]
RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp"
ROS_AUTOMATIC_DISCOVERY_RANGE = "SUBNET"
ROS_DOMAIN_ID = "0"
